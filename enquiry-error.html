<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enquiry Not Sent | Nissi Technologies</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
    }

    .error-box {
      width: 90%;
      max-width: 600px;
      padding: 45px 30px;
      background: #fff;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.08);
    }

    .error-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    h1 {
      color: #111827;
      margin-bottom: 15px;
    }

    p {
      color: #667085;
      line-height: 1.7;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 13px 25px;
      background: #0b63ce;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div class="error-box">
    <div class="error-icon">⚠️</div>

    <h1>Unable to Send Enquiry</h1>

    <p>
      We received your request, but the email service could not send
      your enquiry at this time.
    </p>

    <p>
      Please try again or contact Nissi Technologies directly by phone
      or WhatsApp.
    </p>

    <a href="index.html" class="btn">
      ← Return to Website
    </a>
  </div>

</body>
</html>
